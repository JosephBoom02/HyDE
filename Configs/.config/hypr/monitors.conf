# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-2,2560x1440@144, 0x0,1, vrr, 0
monitor =HDMI-A-2,3840x2160@60,auto,2.6667, bitdepth, 10, vrr, 0
# monitor =HDMI-A-2,3840x2160@120,auto,2.6667, bitdepth, 10, vrr, 0


monitorv2 {
  output = HDMI-A-2
  mode = 3840x2160@60
  position = auto
  scale = 2.6667
  bitdepth = 10
  supports_wide_color = 1
  supports_hdr = 1
  sdr_max_luminance = 100
  vrr = 0
}